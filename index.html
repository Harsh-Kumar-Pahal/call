        padding-top: 0;
      }

      .viewer {
        position: fixed;
        z-index: 400;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- soft animated background -->
  <div class="bg"><i class="blob one"></i><i class="blob two"></i><i class="blob three"></i></div>


  <!-- =========================================================
       HOME
       ========================================================= -->
  <main class="home">
    <section class="card glass">

      <div class="status" id="status"><i class="dot"></i><span id="statusText">Connecting</span></div>

      <div class="label">Your handle</div>
      <button class="handle" id="handleBtn" aria-label="Copy my handle">
        <b>@</b><span id="myHandle">····</span>
      </button>
      <p class="hint" id="handleHint">Tap to copy and share it</p>

      <div class="divider"></div>

      <label class="field">
        <span>@</span>
        <input id="target" placeholder="friend's handle" maxlength="10" aria-label="Friend's handle"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      </label>

      <div class="actions">
        <button class="btn" id="voiceBtn" disabled></button>
        <button class="btn primary" id="videoBtn" disabled></button>
      </div>

    </section>
  </main>


  <!-- =========================================================
       INCOMING CALL
       ========================================================= -->
  <div class="overlay" id="incoming">
    <div class="pulse"><i></i><i></i><i></i><div class="avatar" id="inAv"></div></div>
    <div class="label" id="inType"></div>
    <h2 id="inName"></h2>
    <p class="sub" id="inSub"></p>
    <div class="incoming-actions" id="inBtns"></div>
  </div>


  <!-- =========================================================
       CALL SCREEN
       ========================================================= -->
  <div class="call" id="call">

    <div class="voice-view">
      <div class="people" id="people"></div>
      <div class="voice-status" id="voiceStatus">Calling…</div>
      <canvas id="wave" width="160" height="32"></canvas>
    </div>

    <div class="grid" id="grid" data-n="1"></div>

    <div class="glass hud">
      <i class="live" id="live"></i>
      <span id="hudText">Calling…</span>
    </div>

    <video id="local" autoplay playsinline muted></video>

    <div class="glass dock" id="dock">
      <button class="dock-btn" id="muteBtn" aria-label="Mute microphone"></button>
      <button class="dock-btn" id="camBtn" aria-label="Turn camera off"></button>
      <button class="dock-btn" id="flipBtn" aria-label="Switch camera"></button>
      <button class="dock-btn" id="chatBtn" aria-label="Open chat"></button>
      <button class="dock-btn" id="addBtn" aria-label="Add a person"></button>
      <button class="dock-btn hang" id="hangBtn" aria-label="End call"></button>
    </div>

    <!-- chat -->
    <section class="chat" id="chat" aria-label="Chat">
      <header class="chat-head">
        <button class="chat-back" id="chatBack" aria-label="Back to the call"></button>
        <div class="chat-title">
          <div class="stack" id="chatStack"></div>
          <div class="chat-names" id="chatNames">Chat</div>
        </div>
        <span></span>
      </header>

      <div class="msgs" id="msgs"></div>

      <form class="composer" id="composer">
        <button type="button" class="plus" id="attachBtn" aria-label="Send a photo, video or file"></button>
        <div class="input-wrap">
          <textarea id="chatInput" rows="1" placeholder="Message" aria-label="Message"
                    enterkeyhint="send" autocomplete="off"></textarea>
          <button type="submit" class="send" id="sendBtn" aria-label="Send"></button>
        </div>
        <input type="file" id="filePick" multiple hidden>
      </form>
    </section>

    <!-- full screen photo viewer -->
    <div class="viewer" id="viewer">
      <img id="viewerImg" alt="">
      <button class="viewer-close" id="viewerClose" aria-label="Close"></button>
      <a class="viewer-save" id="viewerSave" aria-label="Save"></a>
    </div>

  </div>


  <!-- =========================================================
       ADD PERSON TO THE CALL
       ========================================================= -->
  <div class="overlay" id="addSheet">
    <div class="sheet glass">
      <h3>Add someone</h3>
      <p id="addCount"></p>
      <label class="field">
        <span>@</span>
        <input id="addInput" placeholder="their handle" maxlength="10" aria-label="Handle to add"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      </label>
      <div class="actions">
        <button class="btn" id="addCancel">Cancel</button>
        <button class="btn primary" id="addGo">Add</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>


  <script>
    /* =========================================================
       SETTINGS
       ========================================================= */

    // most people allowed in one call (you + others). Change it if you like.
    const MAX_PEOPLE = 5;

    // biggest file you can send in chat (in megabytes)
    const MAX_FILE_MB = 25;

    // seconds before the buttons and your own camera fade away during a video call
    const HIDE_AFTER_MS = 3500;

    const PREFIX = 'call-';

    const ICE = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };


    /* =========================================================
       HELPERS
       ========================================================= */
    const $ = id => document.getElementById(id);

    const PHONE_PATH = 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z';

    const ICONS = {
      mic: '<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>',
      micOff: '<svg viewBox="0 0 24 24"><path d="m2 2 20 20M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.6M19 10v1a7 7 0 0 1-.7 3M5 10v1a7 7 0 0 0 11 5.7M12 18v4"/></svg>',
      cam: '<svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>',
      camOff: '<svg viewBox="0 0 24 24"><path d="m2 2 20 20M16 16v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.7 0H14a2 2 0 0 1 2 2v3.3l1 1L22 8v8"/></svg>',
      flip: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>',
      plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12Z"/></svg>',
      back: '<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
      send: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
      file: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>',
      download: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
      close: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
      phone: '<svg viewBox="0 0 24 24"><path d="' + PHONE_PATH + '"/></svg>',
      hang: '<svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="' + PHONE_PATH + '"/></svg>'
    };

    $('voiceBtn').innerHTML = ICONS.phone + 'Voice';
    $('videoBtn').innerHTML = ICONS.cam + 'Video';
    $('muteBtn').innerHTML = ICONS.mic;
    $('camBtn').innerHTML = ICONS.cam;
    $('flipBtn').innerHTML = ICONS.flip;
    $('chatBtn').innerHTML = ICONS.chat;
    $('addBtn').innerHTML = ICONS.plus;
    $('hangBtn').innerHTML = ICONS.hang;
    $('chatBack').innerHTML = ICONS.back + 'Call';
    $('attachBtn').innerHTML = ICONS.plus;
    $('sendBtn').innerHTML = ICONS.send;
    $('viewerClose').innerHTML = ICONS.close;
    $('viewerSave').innerHTML = ICONS.download;

    // keeps your handle the same after a refresh (no login, nothing else is saved)
    const store = {
      get(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {
          /* ignore */
        }
      }
    };

    // random pronounceable handle, like "kemo" or "bazul"
    function generateName() {
      const consonants = 'bdfgklmnprstvz';
      const vowels = 'aeiou';
      const pick = text => text[Math.floor(Math.random() * text.length)];

      let name = pick(consonants) + pick(vowels) + pick(consonants) + pick(vowels);
      if (Math.random() < 0.5) {
        name += pick(consonants);
      }
      return name;
    }

    const cleanName = text => (text || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const validName = text => /^[a-z0-9]{3,10}$/.test(text);
    const handleOf = conn => conn.peer.replace(PREFIX, '');
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const isDesktop = () => window.matchMedia('(min-width: 900px)').matches;

    // colored circle with the first letter
    function paint(element, name) {
      let hue = 0;
      for (const char of name) {
        hue = (hue * 31 + char.charCodeAt(0)) % 360;
      }
      element.textContent = name ? name[0].toUpperCase() : '';
      element.style.background =
        'linear-gradient(135deg, hsl(' + hue + ' 80% 56%), hsl(' + ((hue + 45) % 360) + ' 80% 46%))';
    }

    let toastTimer;
    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }


    /* =========================================================
       STATE
       ========================================================= */
    let peer;
    let myName;
    let online = false;

    let localStream;
    let isVideo = false;
    let facing = 'user';
    let flipping = false;

    let pending;                 // incoming call waiting to be answered
    let startedAt;
    let timerInterval;
    let wakeLock;

    const calls = new Map();     // handle -> media connection (everyone in the call)
    const tiles = new Map();     // handle -> video tile on screen
    const datas = new Map();     // handle -> message channel (invites + chat + files)
    const expected = new Map();  // handle -> time until we accept them automatically


    /* =========================================================
       SOUNDS  (ringing when called, ring-back when calling)
       ========================================================= */
    let audioCtx;
    let toneTimer;

    function getAudioCtx() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // browsers only allow sound after the first tap, so unlock it early
    document.addEventListener('pointerdown', () => {
      try { getAudioCtx(); } catch (e) { /* ignore */ }
    }, { once: true });

    function beep(frequency, delay, length, volume) {
      const ctx = getAudioCtx();
      const start = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.value = frequency;

      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(volume, start + 0.02);
      gain.gain.setValueAtTime(volume, start + length - 0.04);
      gain.gain.linearRampToValueAtTime(0, start + length);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + length + 0.02);
    }

    function startTone(kind) {
      stopTone();
      try {
        const play = () => {
          if (kind === 'incoming') {
            beep(880, 0, 0.2, 0.13);
            beep(880, 0.32, 0.2, 0.13);
          } else {
            beep(425, 0, 1.0, 0.07);
          }
        };

        play();
        toneTimer = setInterval(play, kind === 'incoming' ? 2000 : 3000);

        if (kind === 'incoming' && navigator.vibrate) {
          navigator.vibrate([300, 200, 300]);
        }
      } catch (e) {
        /* ignore */
      }
    }

    function stopTone() {
      clearInterval(toneTimer);
      toneTimer = null;
    }


    /* =========================================================
       CONNECTION  (PeerJS cloud + Google STUN)
       ========================================================= */
    function setState(kind, text) {
      $('status').className = 'status ' + kind;
      $('statusText').textContent = text;
      online = kind === 'on';
    }

    function connect(name, attempt) {
      attempt = attempt || 0;

      if (peer) {
        try { peer.destroy(); } catch (e) { /* ignore */ }
      }

      myName = name;
      $('myHandle').textContent = name;
      setState('', 'Connecting');

      peer = new Peer(PREFIX + name, { config: ICE });
      const thisPeer = peer;

      peer.on('open', () => {
        if (peer !== thisPeer) return;
        store.set('ring_name', name);
        setState('on', 'Online');
      });

      peer.on('call', onIncoming);
      peer.on('connection', setupChannel);

      peer.on('disconnected', () => {
        if (peer === thisPeer && !thisPeer.destroyed) {
          setState('off', 'Reconnecting');
          thisPeer.reconnect();
        }
      });

      peer.on('error', error => {
        if (peer !== thisPeer) return;

        if (error.type === 'unavailable-id') {
          // after a refresh the old session may linger for a few seconds, so retry first
          if (attempt < 4) {
            setState('', 'Reconnecting');
            setTimeout(() => connect(name, attempt + 1), 2000);
            return;
          }
          const fresh = generateName();
          toast('Your old handle was busy. You are now @' + fresh);
          connect(fresh);
          return;
        }

        if (error.type === 'peer-unavailable') {
          toast('That handle is not online right now');
          dropUnanswered();
          return;
        }

        if (['network', 'server-error', 'socket-error'].includes(error.type)) {
          setState('off', 'Offline');
          return;
        }

        toast('Error: ' + error.type);
      });
    }


    /* =========================================================
       MESSAGE CHANNELS  (small direct links between people in
       a call: used for invites, chat text, photos and files)
       ========================================================= */
    function setupChannel(channel) {
      const handle = handleOf(channel);

      const register = () => {
        const current = datas.get(handle);
        if (!current || !current.open) datas.set(handle, channel);
      };
      const forget = () => {
        if (datas.get(handle) === channel) datas.delete(handle);
      };

      channel.on('data', message => onChannelData(channel, message));
      channel.on('open', register);
      channel.on('close', forget);
      channel.on('error', forget);

      if (channel.open) register();
    }

    // returns a channel that is ready to send to this person
    function getChannel(handle) {
      return new Promise((resolve, reject) => {
        let channel = datas.get(handle);

        if (channel && channel.open) {
          resolve(channel);
          return;
        }

        if (!channel) {
          channel = peer.connect(PREFIX + handle, { reliable: true });
          datas.set(handle, channel);
          setupChannel(channel);
        }

        const timer = setTimeout(() => reject(new Error('timeout')), 8000);

        channel.on('open', () => {
          clearTimeout(timer);
          resolve(channel);
        });
        channel.on('error', error => {
          clearTimeout(timer);
          reject(error);
        });
      });
    }

    function sendTo(handle, message) {
      getChannel(handle).then(channel => channel.send(message)).catch(() => {});
    }

    // anything that arrives from another person in the call
    function onChannelData(channel, message) {
      const from = handleOf(channel);

      // only people who are in our call may talk to us
      if (!message || !calls.has(from)) return;

      if (message.t === 'invite') {
        if (validName(message.h)) expected.set(message.h, Date.now() + 120000);
        return;
      }

      if (message.t === 'chat') {
        if (typeof message.text !== 'string') return;
        addMessage({ mine: false, from: from, text: message.text.slice(0, 4000), time: Date.now() });
        notifyChat(from, message.text);
        return;
      }

      if (message.t === 'file') {
        receiveFileStart(from, message);
        return;
      }

      if (message.t === 'chunk') {
        receiveFileChunk(from, message);
        return;
      }

      if (message.t === 'end') {
        receiveFileEnd(from, message);
      }
    }


    /* =========================================================
       CAMERA + MICROPHONE  (highest quality available)
       ========================================================= */
    function videoConstraints(mode) {
      return {
        facingMode: { ideal: mode },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30 }
      };
    }

    const audioConstraints = {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    };

    async function getMedia(video) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: audioConstraints,
          video: video ? videoConstraints(facing) : false
        });
        stream.getVideoTracks().forEach(track => {
          try { track.contentHint = 'detail'; } catch (e) { /* ignore */ }
        });
        return stream;
      } catch (firstError) {
        try {
          return await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
        } catch (secondError) {
          toast(video ? 'Allow camera and microphone to call' : 'Allow microphone access to call');
          return null;
        }
      }
    }

    // keep quality high for 1 person, lower it a little when many people share the call
    async function boostAll() {
      const people = calls.size;
      const videoBitrate = people <= 1 ? 5000000 : people === 2 ? 2500000 : 1200000;
      const audioBitrate = people <= 1 ? 96000 : 48000;

      for (const conn of calls.values()) {
        const pc = conn.peerConnection;
        if (!pc) continue;

        for (const sender of pc.getSenders()) {
          if (!sender.track) continue;
          try {
            const params = sender.getParameters();
            if (!params.encodings || !params.encodings.length) {
              params.encodings = [{}];
            }
            params.encodings[0].maxBitrate = sender.track.kind === 'video' ? videoBitrate : audioBitrate;
            if (sender.track.kind === 'video') params.encodings[0].maxFramerate = 30;
            await sender.setParameters(params);
          } catch (e) {
            /* ignore */
          }
        }
      }
    }


    /* =========================================================
       FRONT / BACK CAMERA SWITCH
       ========================================================= */
    async function flipCamera() {
      if (!localStream || flipping) return;

      const oldTrack = localStream.getVideoTracks()[0];
      if (!oldTrack) return;

      flipping = true;

      const previous = facing;
      const next = previous === 'user' ? 'environment' : 'user';
      const wasEnabled = oldTrack.enabled;

      // release the old camera first, many phones cannot open two at once
      oldTrack.stop();

      async function grab(mode) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(mode) });
        const track = stream.getVideoTracks()[0];
        try { track.contentHint = 'detail'; } catch (e) { /* ignore */ }
        track.enabled = wasEnabled;
        return track;
      }

      let newTrack;
      let used = next;

      try {
        newTrack = await grab(next);
      } catch (e) {
        try {
          newTrack = await grab(previous);
          used = previous;
          toast('Could not switch camera');
        } catch (e2) {
          toast('Camera unavailable');
          flipping = false;
          return;
        }
      }

      localStream.removeTrack(oldTrack);
      localStream.addTrack(newTrack);

      // send the new camera to everyone in the call
      for (const conn of calls.values()) {
        try {
          const sender = conn.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) await sender.replaceTrack(newTrack);
        } catch (e) {
          /* ignore */
        }
      }
      boostAll();

      facing = used;
      $('local').srcObject = localStream;
      $('local').classList.toggle('mirror', facing === 'user');
      flipping = false;
    }


    /* =========================================================
       FADING CONTROLS  (buttons + my own camera disappear after
       a few seconds so everyone can see each other. Tap the
       screen to bring them back.)
       ========================================================= */
    let hideTimer;

    function canAutoHide() {
      return $('call').classList.contains('show')
        && !$('call').classList.contains('voice-mode')
        && !$('chat').classList.contains('show')
        && !$('addSheet').classList.contains('show');
    }

    function showControls() {
      clearTimeout(hideTimer);
      $('call').classList.remove('hide-ui');

      if (canAutoHide()) {
        hideTimer = setTimeout(hideControls, HIDE_AFTER_MS);
      }
    }

    function hideControls() {
      if (canAutoHide()) {
        $('call').classList.add('hide-ui');
      }
    }

    // tap on the video to hide or show the controls
    $('call').addEventListener('click', event => {
      if (event.target.closest('.dock, .hud, .chat, .viewer')) return;

      if ($('call').classList.contains('hide-ui')) {
        showControls();
      } else if (canAutoHide()) {
        clearTimeout(hideTimer);
        $('call').classList.add('hide-ui');
      }
    });

    // laptop: moving the mouse also brings the controls back
    $('call').addEventListener('pointermove', event => {
      if (event.pointerType === 'mouse' && $('call').classList.contains('hide-ui')) showControls();
    });

    // using a button keeps the controls on screen a little longer
    $('dock').addEventListener('pointerdown', showControls);


    /* =========================================================
       PEOPLE IN THE CALL  (tiles on screen)
       ========================================================= */
    function makeTile(handle) {
      const tile = document.createElement('div');
      tile.className = 'tile pending';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      paint(avatar, handle);

      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '@' + handle;

      tile.append(avatar, video, tag);
      $('grid').appendChild(tile);
      tiles.set(handle, tile);
      updateLayout();
    }

    function attachCall(conn, handle) {
      calls.set(handle, conn);
      makeTile(handle);

      conn.on('stream', stream => onRemoteStream(handle, stream));

      conn.on('close', () => {
        if (calls.get(handle) === conn) removePerson(handle, false);
      });

      conn.on('error', () => {
        if (calls.get(handle) === conn) {
          toast('Could not connect to @' + handle);
          removePerson(handle, true);
        }
      });
    }

    function onRemoteStream(handle, stream) {
      const tile = tiles.get(handle);
      if (!tile) return;

      const video = tile.querySelector('video');
      if (video.srcObject !== stream) video.srcObject = stream;

      const refresh = () => {
        const hasVideo = stream.getVideoTracks().some(track => track.readyState === 'live');
        tile.classList.toggle('has-video', hasVideo);
        updateLayout();
      };

      tile.classList.remove('pending');
      stream.onaddtrack = refresh;
      stream.onremovetrack = refresh;
      refresh();

      addAudioSource(handle, stream);
      stopTone();
      $('live').classList.add('ok');

      if (!startedAt) {
        startedAt = Date.now();
        timerInterval = setInterval(tick, 1000);
        showControls();
      }

      tick();
      boostAll();
    }

    function removePerson(handle, silent) {
      calls.delete(handle);

      const tile = tiles.get(handle);
      if (tile) {
        tile.remove();
        tiles.delete(handle);
      }

      const channel = datas.get(handle);
      if (channel) {
        try { channel.close(); } catch (e) { /* ignore */ }
        datas.delete(handle);
      }

      removeAudioSource(handle);
      updateLayout();

      if (!silent) toast('@' + handle + ' left the call');
      if (calls.size === 0) endCall(true);
    }

    // people who never picked up (wrong or offline handle)
    function dropUnanswered() {
      for (const [handle, conn] of Array.from(calls)) {
        const tile = tiles.get(handle);
        if (tile && tile.classList.contains('pending')) {
          try { conn.close(); } catch (e) { /* ignore */ }
          removePerson(handle, true);
        }
      }
    }

    // arrange the screen for however many people there are
    function updateLayout() {
      const names = Array.from(tiles.keys());
      const anyVideo = Array.from(tiles.values()).some(tile => tile.classList.contains('has-video'));

      $('grid').dataset.n = Math.max(names.length, 1);
      $('call').classList.toggle('voice-mode', !isVideo && !anyVideo);

      // voice calls keep the buttons on screen all the time
      if ($('call').classList.contains('voice-mode')) {
        $('call').classList.remove('hide-ui');
      }

      // list used by the voice call view
      const box = $('people');
      box.innerHTML = '';
      box.dataset.n = names.length;

      names.forEach(name => {
        const person = document.createElement('div');
        person.className = 'person' + (tiles.get(name).classList.contains('pending') ? ' pending' : '');

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        paint(avatar, name);

        const label = document.createElement('span');
        label.textContent = '@' + name;

        person.append(avatar, label);
        box.appendChild(person);
      });

      updateChatHead();
      tick();
    }

    function tick() {
      const connected = Array.from(tiles.values()).filter(tile => !tile.classList.contains('pending')).length;
      let text = 'Calling…';

      if (startedAt) {
        const seconds = Math.floor((Date.now() - startedAt) / 1000);
        text = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
        if (connected > 1) text += ' · ' + (connected + 1) + ' people';
      }

      $('hudText').textContent = text;
      $('voiceStatus').textContent = text;
    }


    /* =========================================================
       VOICE WAVE  (one thin line for everyone's voices)
       ========================================================= */
    let analyser;
    let waveFrame;
    const audioSources = new Map();

    function startWave() {
      try {
        const ctx = getAudioCtx();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 512;

        const canvas = $('wave');
        const g = canvas.getContext('2d');
        const ratio = window.devicePixelRatio || 1;
        const width = 160;
        const height = 32;

        canvas.width = width * ratio;
        canvas.height = height * ratio;
        g.setTransform(ratio, 0, 0, ratio, 0, 0);

        const color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2f6bff';
        const data = new Uint8Array(analyser.fftSize);
        const points = 80;

        function draw() {
          analyser.getByteTimeDomainData(data);
          g.clearRect(0, 0, width, height);
          g.beginPath();

          for (let i = 0; i <= points; i++) {
            const t = i / points;
            const sample = (data[Math.floor(t * (data.length - 1))] - 128) / 128;
            const taper = Math.sin(Math.PI * t);
            const x = t * width;
            const y = height / 2 + sample * height * 1.4 * taper;

            if (i === 0) g.moveTo(x, y);
            else g.lineTo(x, y);
          }

          g.strokeStyle = color;
          g.lineWidth = 1.6;
          g.lineJoin = 'round';
          g.lineCap = 'round';
          g.stroke();

          waveFrame = requestAnimationFrame(draw);
        }

        draw();
      } catch (e) {
        /* ignore */
      }
    }

    function addAudioSource(handle, stream) {
      if (!analyser || audioSources.has(handle) || !stream.getAudioTracks().length) return;

      try {
        const source = getAudioCtx().createMediaStreamSource(stream);
        source.connect(analyser);
        audioSources.set(handle, source);
      } catch (e) {
        /* ignore */
      }
    }

    function removeAudioSource(handle) {
      const source = audioSources.get(handle);
      if (source) {
        try { source.disconnect(); } catch (e) { /* ignore */ }
        audioSources.delete(handle);
      }
    }

    function stopWave() {
      cancelAnimationFrame(waveFrame);
      audioSources.forEach(source => {
        try { source.disconnect(); } catch (e) { /* ignore */ }
      });
      audioSources.clear();
      analyser = null;
    }


    /* =========================================================
       STARTING A CALL
       ========================================================= */
    async function startCall(name, video) {
      name = cleanName(name);

      if (!validName(name)) return toast('Enter a handle (3–10 letters or numbers)');
      if (name === myName) return toast('That is your own handle');
      if (!online) return toast('Still connecting. Try again in a moment.');
      if (calls.size > 0 || pending) return;

      getAudioCtx();
      facing = 'user';

      localStream = await getMedia(video);
      if (!localStream) return;

      isVideo = video;
      $('target').value = '';
      updateHomeButtons();

      await openCall();

      const conn = peer.call(PREFIX + name, localStream, { metadata: { video: video } });
      attachCall(conn, name);
      startTone('outgoing');
    }

    async function openCall() {
      tiles.forEach(tile => tile.remove());
      tiles.clear();
      calls.clear();
      $('grid').innerHTML = '';

      startedAt = null;
      $('live').classList.remove('ok');
      $('hudText').textContent = 'Calling…';

      $('local').srcObject = localStream;
      $('local').classList.add('mirror');

      $('call').classList.remove('hide-ui');
      $('call').classList.toggle('has-local', isVideo);
      $('call').classList.toggle('voice-mode', !isVideo);

      $('camBtn').style.display = isVideo ? 'flex' : 'none';
      $('flipBtn').style.display = 'none';

      $('muteBtn').classList.remove('active');
      $('muteBtn').innerHTML = ICONS.mic;
      $('camBtn').classList.remove('active');
      $('camBtn').innerHTML = ICONS.cam;

      resetChat();

      $('call').classList.add('show');
      startWave();
      showControls();

      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {
        /* ignore */
      }

      // only show the switch-camera button when the phone has 2 or more cameras
      if (isVideo) {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cameras = devices.filter(device => device.kind === 'videoinput');
          if (cameras.length > 1) $('flipBtn').style.display = 'flex';
        } catch (e) {
          $('flipBtn').style.display = 'flex';
        }
      }
    }


    /* =========================================================
       INCOMING CALL
       ========================================================= */
    function addIncomingButton(box, className, icon, label, handler) {
      const button = document.createElement('button');
      button.className = 'big-round ' + className;
      button.innerHTML = '<i>' + icon + '</i>' + label;
      button.onclick = handler;
      box.appendChild(button);
    }

    function onIncoming(conn) {
      const handle = handleOf(conn);

      // already in a call
      if (calls.size > 0) {
        const allowed = expected.get(handle) > Date.now();

        // someone we were told about (added by a person in our call): join automatically
        if (allowed && !calls.has(handle) && localStream && calls.size + 1 < MAX_PEOPLE) {
          expected.delete(handle);
          conn.answer(localStream);
          attachCall(conn, handle);
        } else {
          conn.close();
        }
        return;
      }

      if (pending) {
        conn.close();
        return;
      }

      pending = conn;

      const meta = conn.metadata || {};
      const wantsVideo = !!meta.video;
      const others = Array.isArray(meta.group) ? meta.group : [];

      paint($('inAv'), handle);
      $('inName').textContent = '@' + handle;
      $('inType').textContent = wantsVideo ? 'Incoming video call' : 'Incoming voice call';
      $('inSub').textContent = others.length
        ? 'Group call with ' + others.map(name => '@' + name).join(', ')
        : '';

      const box = $('inBtns');
      box.innerHTML = '';
      addIncomingButton(box, 'decline', ICONS.hang, 'Decline', decline);
      addIncomingButton(box, 'accept', ICONS.phone, wantsVideo ? 'Voice only' : 'Answer', () => answer(false));
      if (wantsVideo) {
        addIncomingButton(box, 'accept', ICONS.cam, 'Video', () => answer(true));
      }

      $('incoming').classList.add('show');
      startTone('incoming');

      // caller hung up before we answered
      conn.on('close', () => {
        if (pending === conn) {
          pending = null;
          stopTone();
          $('incoming').classList.remove('show');
          toast('Missed call from @' + handle);
        }
      });
    }

    async function answer(video) {
      stopTone();

      const conn = pending;
      pending = null;
      $('incoming').classList.remove('show');

      facing = 'user';
      localStream = await getMedia(video);
      if (!localStream) {
        conn.close();
        return;
      }

      isVideo = video;
      await openCall();

      conn.answer(localStream);
      attachCall(conn, handleOf(conn));

      // if this is a group call, also connect to everyone else already in it
      const others = conn.metadata && Array.isArray(conn.metadata.group) ? conn.metadata.group : [];
      others.forEach(name => {
        if (!validName(name) || name === myName || calls.has(name)) return;
        if (calls.size + 1 >= MAX_PEOPLE) return;

        const extra = peer.call(PREFIX + name, localStream, { metadata: { video: isVideo, join: true } });
        attachCall(extra, name);
      });
    }

    function decline() {
      stopTone();
      const conn = pending;
      pending = null;
      $('incoming').classList.remove('show');
      if (conn) conn.close();
    }


    /* =========================================================
       ADD PEOPLE TO THE CALL  (the + button)
       ========================================================= */
    function openAdd() {
      if (calls.size + 1 >= MAX_PEOPLE) {
        toast('This call is full (' + MAX_PEOPLE + ' people)');
        return;
      }
      clearTimeout(hideTimer);
      $('addCount').textContent = (calls.size + 1) + ' of ' + MAX_PEOPLE + ' people in this call';
      $('addInput').value = '';
      $('addSheet').classList.add('show');
      setTimeout(() => $('addInput').focus(), 60);
    }

    function closeAdd() {
      $('addSheet').classList.remove('show');
      $('addInput').blur();
      if ($('call').classList.contains('show')) showControls();
    }

    function addPerson() {
      const name = cleanName($('addInput').value);

      if (!validName(name)) return toast('Enter a handle (3–10 letters or numbers)');
      if (name === myName) return toast('That is your own handle');
      if (calls.has(name)) return toast('@' + name + ' is already in the call');
      if (calls.size + 1 >= MAX_PEOPLE) return toast('This call is full');
      if (!localStream) return;

      closeAdd();

      // tell everyone already here to expect the new person
      const current = Array.from(calls.keys());
      current.forEach(handle => sendTo(handle, { t: 'invite', h: name }));

      // call the new person; they will connect to everyone else themselves
      const conn = peer.call(PREFIX + name, localStream, {
        metadata: { video: isVideo, group: current, host: myName }
      });
      attachCall(conn, name);
      toast('Calling @' + name + '…');
    }

    $('addBtn').onclick = openAdd;
    $('addCancel').onclick = closeAdd;
    $('addGo').onclick = addPerson;

    $('addInput').addEventListener('input', event => {
      event.target.value = cleanName(event.target.value);
    });

    $('addInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') addPerson();
    });


    /* =========================================================
       CHAT  (text, links, photos, videos, files)
       ========================================================= */
    const CHUNK_SIZE = 12 * 1024;       // size of each piece of a file we send

    const chat = {
      unread: 0,
      lastTime: 0,                      // time of the newest message
      last: null,                       // { mine, from, time, bubble } of the newest message
      delivery: null                    // the small "Delivered" label under my last message
    };

    const incomingFiles = new Map();    // files that are still arriving
    const fileUrls = [];                // download links we created (cleaned up after the call)

    const isChatOpen = () => $('chat').classList.contains('show');

    /* ---------- small helpers ---------- */
    function kindOf(mime) {
      mime = String(mime || '');
      if (mime.startsWith('image/')) return 'image';
      if (mime.startsWith('video/')) return 'video';
      return 'file';
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function formatStamp(time) {
      return 'Today ' + new Date(time).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    // turns web addresses inside a message into clickable links
    function linkify(text) {
      const fragment = document.createDocumentFragment();
      const pattern = /((?:https?:\/\/|www\.)[^\s<]+)/gi;
      let lastIndex = 0;
      let match;

      while ((match = pattern.exec(text))) {
        let url = match[0];
        let trailing = '';

        const tail = url.match(/[.,!?;:)\]]+$/);
        if (tail) {
          trailing = tail[0];
          url = url.slice(0, -trailing.length);
        }

        if (match.index > lastIndex) fragment.append(text.slice(lastIndex, match.index));

        const link = document.createElement('a');
        link.href = url.startsWith('www.') ? 'https://' + url : url;
        link.textContent = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        fragment.append(link);

        if (trailing) fragment.append(trailing);
        lastIndex = match.index + match[0].length;
      }

      if (lastIndex < text.length) fragment.append(text.slice(lastIndex));
      return fragment;
    }

    /* ---------- the people shown at the top of the chat ---------- */
    function updateChatHead() {
      const names = Array.from(tiles.keys());

      const stack = $('chatStack');
      stack.innerHTML = '';
      names.slice(0, 4).forEach(name => {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        paint(avatar, name);
        stack.appendChild(avatar);
      });

      $('chatNames').textContent = names.length ? names.map(name => '@' + name).join(', ') : 'Chat';
    }

    /* ---------- open / close ---------- */
    // on phones the chat is a full screen, so follow the on-screen keyboard
    function fitChat() {
      const el = $('chat');
      const vv = window.visualViewport;

      if (!vv || isDesktop() || !isChatOpen()) {
        el.style.top = '';
        el.style.bottom = '';
        el.style.height = '';
        return;
      }

      el.style.bottom = 'auto';
      el.style.top = vv.offsetTop + 'px';
      el.style.height = vv.height + 'px';
    }

    function scrollMessagesToBottom() {
      const list = $('msgs');
      list.scrollTop = list.scrollHeight;
    }

    function openChat() {
      clearTimeout(hideTimer);
      $('call').classList.remove('hide-ui');
      $('chat').classList.add('show');

      chat.unread = 0;
      updateBadge();
      updateChatHead();
      fitChat();
      scrollMessagesToBottom();

      // laptop: ready to type. Phone: don't pop the keyboard up by itself.
      if (isDesktop()) setTimeout(() => $('chatInput').focus(), 60);
    }

    function closeChat() {
      $('chat').classList.remove('show');
      $('chatInput').blur();
      fitChat();
      closeViewer();
      if ($('call').classList.contains('show')) showControls();
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        fitChat();
        scrollMessagesToBottom();
      });
      window.visualViewport.addEventListener('scroll', fitChat);
    }

    $('chatBtn').onclick = () => (isChatOpen() ? closeChat() : openChat());
    $('chatBack').onclick = closeChat;

    /* ---------- unread badge + new message alert ---------- */
    function updateBadge() {
      const old = $('chatBtn').querySelector('.badge');
      if (old) old.remove();

      if (chat.unread > 0) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = chat.unread > 9 ? '9+' : chat.unread;
        $('chatBtn').appendChild(badge);
      }
    }

    function notifyChat(from, preview) {
      if (isChatOpen()) return;

      chat.unread += 1;
      updateBadge();
      showControls();

      try { beep(1200, 0, 0.08, 0.06); } catch (e) { /* ignore */ }
      toast('@' + from + ': ' + (preview.length > 60 ? preview.slice(0, 60) + '…' : preview));
    }

    /* ---------- drawing messages ---------- */
    function fillAttachment(bubble, file) {
      bubble.innerHTML = '';
      bubble.classList.remove('loading');

      if (file.kind === 'image') {
        bubble.classList.add('media');

        const image = document.createElement('img');
        image.src = file.url;
        image.alt = file.name;
        image.onclick = () => openViewer(file);
        bubble.appendChild(image);
        bubble.appendChild(buildSaveButton(file));
        return;
      }

      if (file.kind === 'video') {
        bubble.classList.add('media');

        const video = document.createElement('video');
        video.src = file.url;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        bubble.appendChild(video);
        bubble.appendChild(buildSaveButton(file));
        return;
      }

      // any other file: a card the other person can tap to download
      const card = document.createElement('a');
      card.className = 'file-card';
      card.href = file.url;
      card.download = file.name;

      const icon = document.createElement('div');
      icon.className = 'file-icon';
      icon.innerHTML = ICONS.file;

      const text = document.createElement('div');
      text.className = 'file-text';

      const name = document.createElement('span');
      name.className = 'file-name';
      name.textContent = file.name;

      const size = document.createElement('span');
      size.className = 'file-size';
      size.textContent = formatSize(file.size);

      const down = document.createElement('div');
      down.className = 'file-down';
      down.innerHTML = ICONS.download;

      text.append(name, size);
      card.append(icon, text, down);
      bubble.appendChild(card);
    }

    function buildSaveButton(file) {
      const link = document.createElement('a');
      link.className = 'save';
      link.href = file.url;
      link.download = file.name;
      link.setAttribute('aria-label', 'Save ' + file.name);
      link.innerHTML = ICONS.download;
      return link;
    }

    function buildProgressBar() {
      const bar = document.createElement('span');
      bar.className = 'bar';
      bar.innerHTML = '<i></i>';
      return bar;
    }

    // adds one message to the chat and returns small helpers to update it later
    function addMessage(message) {
      const list = $('msgs');
      const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
      const time = message.time || Date.now();

      // a small time label for the first message, and after a long pause
      if (!chat.lastTime || time - chat.lastTime > 10 * 60 * 1000) {
        const stamp = document.createElement('div');
        stamp.className = 'sep';
        stamp.textContent = formatStamp(time);
        list.appendChild(stamp);
        chat.last = null;
      }
      chat.lastTime = time;

      // messages from the same person close together are grouped
      const grouped = !!chat.last
        && chat.last.mine === message.mine
        && chat.last.from === message.from
        && time - chat.last.time < 3 * 60 * 1000;

      if (grouped) chat.last.bubble.classList.remove('tail');

      if (chat.delivery) {
        chat.delivery.remove();
        chat.delivery = null;
      }

      const row = document.createElement('div');
      row.className = 'msg ' + (message.mine ? 'me' : 'them') + (grouped ? '' : ' first');

      // in a group call, show who sent it
      if (!message.mine && !grouped && tiles.size > 1) {
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = '@' + message.from;
        row.appendChild(who);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble tail';
      row.appendChild(bubble);

      let bar = null;

      if (message.file && message.url) {
        fillAttachment(bubble, message.file);
      } else if (message.file) {
        // still arriving: show the name and a progress line
        bubble.classList.add('loading');

        const label = document.createElement('span');
        label.textContent = 'Receiving ' + message.file.name + '…';
        bubble.appendChild(label);
      } else {
        bubble.appendChild(linkify(message.text));
      }

      if (message.progress) {
        bar = buildProgressBar();
        bubble.appendChild(bar);
      }

      list.appendChild(row);
      chat.last = { mine: message.mine, from: message.from, time: time, bubble: bubble };

      if (nearBottom || message.mine) scrollMessagesToBottom();

      return {
        row: row,
        bubble: bubble,

        setProgress(fraction) {
          if (bar) bar.firstChild.style.width = Math.round(fraction * 100) + '%';
        },

        // the whole file arrived: show it
        complete(file) {
          if (bar) {
            bar.remove();
            bar = null;
          }
          fillAttachment(bubble, file);
          if (isChatOpen()) scrollMessagesToBottom();
        },

        // small gray status under my newest message
        setDelivery(text, failed) {
          if (chat.delivery) chat.delivery.remove();
          const label = document.createElement('div');
          label.className = 'delivery' + (failed ? ' bad' : '');
          label.textContent = text;
          row.appendChild(label);
          chat.delivery = label;
        }
      };
    }

    /* ---------- people who can receive right now ---------- */
    function chatTargets() {
      return Array.from(calls.keys()).filter(handle => {
        const tile = tiles.get(handle);
        return tile && !tile.classList.contains('pending');
      });
    }

    /* ---------- sending text ---------- */
    async function sendText() {
      const text = $('chatInput').value.trim();
      if (!text) return;

      const targets = chatTargets();
      if (!targets.length) {
        toast('No one has joined the call yet');
        return;
      }

      const time = Date.now();
      const item = addMessage({ mine: true, from: myName, text: text, time: time });

      $('chatInput').value = '';
      growInput();

      const payload = { t: 'chat', id: uid(), text: text };
      const results = await Promise.allSettled(
        targets.map(handle => getChannel(handle).then(channel => channel.send(payload)))
      );

      const delivered = results.some(result => result.status === 'fulfilled');
      item.setDelivery(delivered ? 'Delivered' : 'Not delivered', !delivered);
    }

    /* ---------- sending photos, videos and files ---------- */
    async function sendFile(file) {
      if (file.size > MAX_FILE_MB * 1048576) {
        toast('"' + file.name + '" is too big (max ' + MAX_FILE_MB + ' MB)');
        return;
      }

      const targets = chatTargets();
      if (!targets.length) {
        toast('No one has joined the call yet');
        return;
      }

      const url = URL.createObjectURL(file);
      fileUrls.push(url);

      const info = {
        kind: kindOf(file.type),
        name: file.name || 'file',
        size: file.size,
        mime: file.type || 'application/octet-stream',
        url: url
      };

      const item = addMessage({ mine: true, from: myName, file: info, url: url, progress: true, time: Date.now() });

      const id = uid();
      const header = { t: 'file', id: id, name: info.name, size: info.size, mime: info.mime };
      const buffer = await file.arrayBuffer();

      let sentBytes = 0;
      const totalBytes = Math.max(buffer.byteLength * targets.length, 1);

      const results = await Promise.allSettled(targets.map(async handle => {
        const channel = await getChannel(handle);
        channel.send(header);

        for (let offset = 0, index = 0; offset < buffer.byteLength; offset += CHUNK_SIZE, index++) {
          // wait if too much data is already waiting to be sent
          while (channel.dataChannel && channel.dataChannel.bufferedAmount > 1048576) {
            await sleep(25);
          }

          const piece = buffer.slice(offset, offset + CHUNK_SIZE);
          channel.send({ t: 'chunk', id: id, i: index, d: piece });

          sentBytes += piece.byteLength;
          item.setProgress(sentBytes / totalBytes);
        }

        channel.send({ t: 'end', id: id });
      }));

      const delivered = results.some(result => result.status === 'fulfilled');
      item.complete(info);
      item.setDelivery(delivered ? 'Delivered' : 'Not delivered', !delivered);
    }

    /* ---------- receiving files ---------- */
    function receiveFileStart(from, message) {
      const size = Number(message.size) || 0;
      if (typeof message.id !== 'string' || size > MAX_FILE_MB * 1048576 * 1.1) return;

      const info = {
        kind: kindOf(message.mime),
        name: String(message.name || 'file').slice(0, 120),
        size: size,
        mime: String(message.mime || 'application/octet-stream').slice(0, 100)
      };

      const item = addMessage({ mine: false, from: from, file: info, progress: true, time: Date.now() });

      incomingFiles.set(from + ':' + message.id, { info: info, parts: [], received: 0, item: item });
    }

    function receiveFileChunk(from, message) {
      const record = incomingFiles.get(from + ':' + message.id);
      if (!record || !message.d) return;

      record.parts.push(message.d);
      record.received += message.d.byteLength;
      record.item.setProgress(record.info.size ? record.received / record.info.size : 0);
    }

    function receiveFileEnd(from, message) {
      const key = from + ':' + message.id;
      const record = incomingFiles.get(key);
      if (!record) return;

      incomingFiles.delete(key);

      const blob = new Blob(record.parts, { type: record.info.mime });
      const url = URL.createObjectURL(blob);
      fileUrls.push(url);

      const file = Object.assign({}, record.info, { url: url });
      record.item.complete(file);

      const words = { image: 'a photo', video: 'a video', file: 'a file' };
      notifyChat(from, 'sent ' + words[file.kind]);
    }

    /* ---------- photo viewer ---------- */
    function openViewer(file) {
      $('viewerImg').src = file.url;
      $('viewerSave').href = file.url;
      $('viewerSave').download = file.name;
      $('viewer').classList.add('show');
    }

    function closeViewer() {
      $('viewer').classList.remove('show');
      $('viewerImg').removeAttribute('src');
    }

    $('viewerClose').onclick = closeViewer;
    $('viewer').addEventListener('click', event => {
      if (event.target === $('viewer')) closeViewer();
    });

    /* ---------- message box ---------- */
    function growInput() {
      const box = $('chatInput');
      box.style.height = 'auto';
      box.style.height = Math.min(box.scrollHeight, 120) + 'px';
      $('composer').classList.toggle('has-text', box.value.trim().length > 0);
    }

    $('chatInput').addEventListener('input', growInput);

    $('chatInput').addEventListener('keydown', event => {
      // laptop: Enter sends, Shift+Enter makes a new line. Phone: Enter is a new line.
      if (event.key === 'Enter' && !event.shiftKey && window.matchMedia('(pointer: fine)').matches) {
        event.preventDefault();
        sendText();
      }
    });

    $('composer').addEventListener('submit', event => {
      event.preventDefault();
      sendText();
    });

    $('attachBtn').onclick = () => $('filePick').click();

    $('filePick').addEventListener('change', event => {
      Array.from(event.target.files).forEach(file => sendFile(file));
      event.target.value = '';
    });

    // clear everything when a new call starts or the call ends
    function resetChat() {
      $('msgs').innerHTML = '';
      $('chat').classList.remove('show');
      $('chatInput').value = '';
      growInput();
      closeViewer();
      fitChat();

      chat.unread = 0;
      chat.lastTime = 0;
      chat.last = null;
      chat.delivery = null;
      updateBadge();

      incomingFiles.clear();
      fileUrls.splice(0).forEach(url => URL.revokeObjectURL(url));
    }

    $('chatInput').placeholder = 'Message';


    /* =========================================================
       ENDING A CALL
       ========================================================= */
    function endCall(remoteClosed) {
      stopTone();
      clearTimeout(hideTimer);

      Array.from(calls.values()).forEach(conn => {
        try { conn.close(); } catch (e) { /* ignore */ }
      });
      calls.clear();

      datas.forEach(channel => {
        try { channel.close(); } catch (e) { /* ignore */ }
      });
      datas.clear();
      expected.clear();

      tiles.forEach(tile => tile.remove());
      tiles.clear();
      $('grid').innerHTML = '';

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      clearInterval(timerInterval);
      timerInterval = null;
      startedAt = null;

      stopWave();

      if (wakeLock) {
        try { wakeLock.release(); } catch (e) { /* ignore */ }
        wakeLock = null;
      }

      $('local').srcObject = null;
      $('call').classList.remove('show', 'hide-ui');
      $('addSheet').classList.remove('show');
      resetChat();

      if (pending) {
        pending = null;
        $('incoming').classList.remove('show');
      }

      if (remoteClosed) toast('Call ended');
    }


    /* =========================================================
       CALL BUTTONS
       ========================================================= */
    $('muteBtn').onclick = () => {
      const track = localStream && localStream.getAudioTracks()[0];
      if (!track) return;

      track.enabled = !track.enabled;
      $('muteBtn').classList.toggle('active', !track.enabled);
      $('muteBtn').innerHTML = track.enabled ? ICONS.mic : ICONS.micOff;
    };

    $('camBtn').onclick = () => {
      const track = localStream && localStream.getVideoTracks()[0];
      if (!track) return;

      track.enabled = !track.enabled;
      $('camBtn').classList.toggle('active', !track.enabled);
      $('camBtn').innerHTML = track.enabled ? ICONS.cam : ICONS.camOff;
    };

    $('flipBtn').onclick = flipCamera;
    $('hangBtn').onclick = () => endCall(false);

    // Esc closes the photo viewer, the chat, or the add sheet
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;

      if ($('viewer').classList.contains('show')) closeViewer();
      else if (isChatOpen()) closeChat();
      else if ($('addSheet').classList.contains('show')) closeAdd();
    });


    /* =========================================================
       HOME SCREEN
       ========================================================= */
    function updateHomeButtons() {
      const ready = validName($('target').value);
      $('voiceBtn').disabled = !ready;
      $('videoBtn').disabled = !ready;
    }

    $('target').addEventListener('input', event => {
      event.target.value = cleanName(event.target.value);
      updateHomeButtons();
    });

    $('target').addEventListener('keydown', event => {
      if (event.key === 'Enter' && validName($('target').value)) {
        startCall($('target').value, false);
      }
    });

    $('voiceBtn').onclick = () => startCall($('target').value, false);
    $('videoBtn').onclick = () => startCall($('target').value, true);

    $('handleBtn').onclick = async () => {
      try {
        await navigator.clipboard.writeText(myName);
        $('handleHint').textContent = 'Copied!';
      } catch (e) {
        $('handleHint').textContent = 'Your handle is @' + myName;
      }
      setTimeout(() => { $('handleHint').textContent = 'Tap to copy and share it'; }, 1600);
    };


    /* =========================================================
       START
       ========================================================= */
    if (!navigator.mediaDevices) {
      setState('off', 'HTTPS required');
      toast('Calls need HTTPS. Host this file on a secure site.');
    } else {
      connect(store.get('ring_name') || generateName());
    }
  </script>
</body>
</html>
