<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#dbe7ff">
  <title>Nexa</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    /* =========================================================
       1. THEME VARIABLES  (change colors here)
       ========================================================= */
    :root {
      color-scheme: light;

      --ink: #0e1a33;
      --muted: #5d6c8a;

      --accent: #2f6bff;
      --accent-2: #00b8f0;
      --go: #12b886;
      --stop: #ff4560;

      /* glass look */
      --glass: rgba(255, 255, 255, 0.42);
      --glass-strong: rgba(255, 255, 255, 0.62);
      --glass-border: rgba(255, 255, 255, 0.75);
      --glass-shadow: 0 20px 50px -18px rgba(40, 70, 150, 0.35);
      --blur: blur(26px) saturate(1.6);

      /* chat colors (iMessage style) */
      --im-blue: #0a84ff;
      --im-gray: #e9e9eb;
      --im-line: #e5e5ea;
      --im-text-muted: #8e8e93;

      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }


    /* =========================================================
       2. BASE / RESET
       ========================================================= */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      color: var(--ink);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    svg {
      width: 1em;
      height: 1em;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .avatar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
    }

    .label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* the frosted glass effect, used by every panel */
    .glass {
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }


    /* =========================================================
       3. BACKGROUND  (soft moving color, so the glass has
          something to blur)
       ========================================================= */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(135deg, #dbe7ff, #ece2ff 55%, #ffe4f2);
    }

    .blob {
      position: absolute;
      width: 46vmax;
      height: 46vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.7;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .blob.one {
      top: -12vmax;
      left: -10vmax;
      background: #6aa8ff;
    }

    .blob.two {
      right: -14vmax;
      bottom: -12vmax;
      background: #b58cff;
      animation-delay: -6s;
    }

    .blob.three {
      top: 30%;
      left: 40%;
      width: 34vmax;
      height: 34vmax;
      background: #5de0e6;
      opacity: 0.5;
      animation-delay: -11s;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(6vmax, -4vmax) scale(1.12);
      }
    }


    /* =========================================================
       4. HOME SCREEN  (one small centered card)
       ========================================================= */
    .home {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 26px 22px 24px;
      border-radius: 32px;
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.on {
      color: var(--go);
    }

    .status.on .dot {
      background: var(--go);
      box-shadow: 0 0 0 4px rgba(18, 184, 134, 0.2);
    }

    .status.off {
      color: var(--stop);
    }

    .status.off .dot {
      background: var(--stop);
    }

    .handle {
      display: block;
      width: 100%;
      margin: 6px 0 2px;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      word-break: break-all;
    }

    .handle b {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hint {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      margin: 22px 0;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 -1px 0 rgba(60, 90, 160, 0.1);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(47, 107, 255, 0.14);
    }

    .field > span {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }

    .field input {
      flex: 1;
      min-width: 0;
      padding: 15px 0;
      border: 0;
      outline: none;
      background: none;
      color: var(--ink);
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
    }

    .field input::placeholder {
      color: #8f9bb4;
      font-weight: 500;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 22px;
      border-radius: 15px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.12s, opacity 0.2s;
    }

    .btn svg {
      font-size: 18px;
      color: var(--accent);
    }

    .btn.primary {
      color: #ffffff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 22px -10px rgba(47, 107, 255, 0.8);
    }

    .btn.primary svg {
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }


    /* =========================================================
       5. TOAST MESSAGE
       ========================================================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 16px);
      z-index: 300;
      max-width: 90%;
      padding: 11px 18px;
      border-radius: 14px;
      background: rgba(14, 26, 51, 0.88);
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* while on a call, keep the toast above the buttons */
    .call.show ~ .toast {
      bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    }


    /* =========================================================
       6. OVERLAYS  (incoming call + add person)
       ========================================================= */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: rgba(225, 233, 250, 0.45);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .overlay.show {
      display: flex;
      animation: fade-in 0.25s ease;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* incoming call */
    .pulse {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 26px;
    }

    .pulse i {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: ping 2s ease-out infinite;
    }

    .pulse i:nth-child(2) {
      animation-delay: 0.66s;
    }

    .pulse i:nth-child(3) {
      animation-delay: 1.33s;
    }

    @keyframes ping {
      0% {
        transform: scale(1);
        opacity: 0.55;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .pulse .avatar {
      position: absolute;
      inset: 0;
      font-size: 40px;
    }

    .overlay h2 {
      margin: 6px 0 4px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .overlay .label {
      color: var(--accent);
    }

    .overlay .sub {
      min-height: 20px;
      margin: 0 0 30px;
      font-size: 13px;
      color: var(--muted);
    }

    .incoming-actions {
      display: flex;
      justify-content: center;
      gap: 26px;
    }

    .big-round {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .big-round i {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 25px;
      font-style: normal;
      color: #ffffff;
    }

    .big-round.decline i {
      background: var(--stop);
      box-shadow: 0 12px 26px -8px var(--stop);
    }

    .big-round.accept i {
      background: var(--go);
      box-shadow: 0 12px 26px -8px var(--go);
    }

    /* add person sheet */
    .sheet {
      width: 100%;
      max-width: 320px;
      padding: 22px 20px 20px;
      border-radius: 28px;
    }

    .sheet h3 {
      margin: 0 0 2px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .sheet p {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
    }

    #addSheet {
      z-index: 250;
    }


    /* =========================================================
       7. CALL SCREEN  (full screen, glass controls)
       ========================================================= */
    .call {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      overflow: hidden;
      background: linear-gradient(135deg, #dbe7ff, #ece2ff 55%, #ffe4f2);
    }

    .call.show {
      display: block;
    }

    /* ----- video grid: 1 person fills the screen, more people share it ----- */
    .grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-auto-rows: 1fr;
      grid-template-columns: 1fr;
      transition: padding 0.35s ease;
    }

    .grid:not([data-n="1"]) {
      gap: 8px;
      padding:
        calc(64px + env(safe-area-inset-top, 0px))
        8px
        calc(96px + env(safe-area-inset-bottom, 0px));
    }

    /* controls hidden: people get the whole screen */
    .call.hide-ui .grid:not([data-n="1"]) {
      padding:
        calc(8px + env(safe-area-inset-top, 0px))
        8px
        calc(8px + env(safe-area-inset-bottom, 0px));
    }

    .grid[data-n="3"],
    .grid[data-n="4"],
    .grid[data-n="5"],
    .grid[data-n="6"] {
      grid-template-columns: 1fr 1fr;
    }

    /* wide screens: place people side by side */
    @media (min-aspect-ratio: 1/1) {
      .grid[data-n="2"] {
        grid-template-columns: 1fr 1fr;
      }

      .grid[data-n="5"],
      .grid[data-n="6"] {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .tile {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }

    .grid:not([data-n="1"]) .tile {
      border: 1px solid var(--glass-border);
      border-radius: 24px;
    }

    .tile .avatar {
      width: 72px;
      height: 72px;
      font-size: 30px;
    }

    .tile video {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile.has-video video {
      display: block;
    }

    .tile.pending .avatar {
      opacity: 0.55;
    }

    .tag {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 12.5px;
      font-weight: 700;
    }

    .tile.pending .tag::after {
      content: " · calling…";
      font-weight: 500;
      color: var(--muted);
    }

    .grid[data-n="1"] .tag {
      display: none;
    }

    /* ----- top status pill ----- */
    .hud {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5a524;
      animation: blink 1s infinite;
    }

    .live.ok {
      background: var(--go);
      animation: none;
      box-shadow: 0 0 0 4px rgba(18, 184, 134, 0.2);
    }

    @keyframes blink {
      50% {
        opacity: 0.3;
      }
    }

    /* ----- my own camera ----- */
    #local {
      position: absolute;
      top: calc(64px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 3;
      display: none;
      width: 26vw;
      min-width: 88px;
      max-width: 130px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 20px;
      background: #b9c9e3;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 14px 34px -8px rgba(10, 22, 48, 0.45);
      transition: opacity 0.35s ease;
    }

    #local.mirror {
      transform: scaleX(-1);
    }

    .call.has-local #local {
      display: block;
    }

    /* ----- bottom buttons ----- */
    .dock {
      position: absolute;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .dock-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--glass-border);
      font-size: 20px;
      transition: transform 0.15s;
    }

    .dock-btn:active {
      transform: scale(0.93);
    }

    .dock-btn.active {
      background: var(--ink);
      color: #ffffff;
    }

    .dock-btn.hang {
      background: var(--stop);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 10px 22px -8px var(--stop);
    }

    /* number of unread chat messages */
    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border: 2px solid #ffffff;
      border-radius: 10px;
      background: var(--stop);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }

    /* ----- fade the controls and my camera after a few seconds ----- */
    .call.hide-ui .hud,
    .call.hide-ui .dock,
    .call.hide-ui #local {
      opacity: 0;
      pointer-events: none;
    }

    .call.hide-ui .hud {
      transform: translate(-50%, -12px);
    }

    .call.hide-ui .dock {
      transform: translate(-50%, 16px);
    }

    /* ----- voice call view: small and centered ----- */
    .voice-view {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .people {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 380px;
    }

    .person {
      width: 84px;
    }

    .person .avatar {
      width: 64px;
      height: 64px;
      margin: 0 auto 8px;
      font-size: 26px;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8);
    }

    .person span {
      display: block;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .person.pending {
      opacity: 0.5;
    }

    /* a single person gets a bigger avatar */
    .people[data-n="1"] .person {
      width: auto;
    }

    .people[data-n="1"] .avatar {
      width: 96px;
      height: 96px;
      margin-bottom: 14px;
      font-size: 40px;
    }

    .people[data-n="1"] .person span {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .voice-status {
      margin-top: 18px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    #wave {
      display: block;
      width: 160px;
      height: 32px;
      margin-top: 14px;
    }

    .call.voice-mode .voice-view {
      display: flex;
    }

    .call.voice-mode .grid,
    .call.voice-mode .hud {
      display: none;
    }


    /* =========================================================
       8. CHAT  (iMessage look: blue bubbles on the right,
          gray bubbles on the left)
       ========================================================= */
    .chat {
      position: absolute;
      inset: 0;                      /* phones: takes the whole screen */
      z-index: 30;
      display: none;
      flex-direction: column;
      background: #ffffff;
      color: #000000;
    }

    .chat.show {
      display: flex;
      animation: chat-up 0.28s ease;
    }

    @keyframes chat-up {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: none;
        opacity: 1;
      }
    }

    /* ----- top bar ----- */
    .chat-head {
      flex: none;
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      align-items: center;
      min-height: 62px;
      padding: env(safe-area-inset-top, 0px) 6px 0;
      background: rgba(247, 247, 249, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--im-line);
    }

    .chat-back {
      display: flex;
      align-items: center;
      gap: 2px;
      width: fit-content;
      padding: 10px 8px;
      color: var(--im-blue);
      font-size: 17px;
    }

    .chat-back svg {
      font-size: 24px;
      stroke-width: 2.4;
    }

    .chat-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 0;
      padding: 6px 0;
    }

    .stack {
      display: flex;
    }

    .stack .avatar {
      width: 30px;
      height: 30px;
      margin-left: -8px;
      border: 2px solid #f7f7f9;
      font-size: 13px;
    }

    .stack .avatar:first-child {
      margin-left: 0;
    }

    .chat-names {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11.5px;
      font-weight: 500;
    }

    /* ----- messages ----- */
    .msgs {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 8px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .msgs:empty::before {
      content: "Messages, photos, videos and files go straight to the people on this call. They disappear when the call ends.";
      margin: auto;
      max-width: 260px;
      color: var(--im-text-muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .sep {
      margin: 12px 0 6px;
      color: var(--im-text-muted);
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
    }

    .msg {
      display: flex;
      flex-direction: column;
      margin-top: 2px;
    }

    .msg.first {
      margin-top: 10px;
    }

    .msg.me {
      align-items: flex-end;
    }

    .msg.them {
      align-items: flex-start;
    }

    .who {
      margin: 0 0 2px 14px;
      color: var(--im-text-muted);
      font-size: 11.5px;
    }

    .bubble {
      position: relative;
      max-width: 78%;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 16px;
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .me .bubble {
      background: var(--im-blue);
      color: #ffffff;
    }

    .them .bubble {
      background: var(--im-gray);
      color: #000000;
    }

    .bubble a {
      color: inherit;
      text-decoration: underline;
    }

    .them .bubble a {
      color: var(--im-blue);
    }

    /* the little curved tail on the last bubble of a group */
    .bubble.tail::before,
    .bubble.tail::after {
      content: "";
      position: absolute;
      bottom: 0;
      height: 20px;
    }

    .me .bubble.tail::before {
      right: -8px;
      width: 20px;
      background: var(--im-blue);
      border-bottom-left-radius: 16px 14px;
    }

    .me .bubble.tail::after {
      right: -26px;
      width: 26px;
      background: #ffffff;
      border-bottom-left-radius: 10px;
    }

    .them .bubble.tail::before {
      left: -8px;
      width: 20px;
      background: var(--im-gray);
      border-bottom-right-radius: 16px 14px;
    }

    .them .bubble.tail::after {
      left: -26px;
      width: 26px;
      background: #ffffff;
      border-bottom-right-radius: 10px;
    }

    .delivery {
      margin: 3px 4px 0 0;
      color: var(--im-text-muted);
      font-size: 11px;
      font-weight: 500;
    }

    .delivery.bad {
      color: var(--stop);
    }

    /* photos and videos have no colored bubble */
    .bubble.media {
      padding: 0;
      overflow: hidden;
      background: none;
      line-height: 0;
    }

    .bubble.media.tail::before,
    .bubble.media.tail::after {
      display: none;
    }

    .bubble.media img,
    .bubble.media video {
      display: block;
      max-width: min(260px, 100%);
      max-height: 340px;
      border-radius: 18px;
      background: var(--im-gray);
      cursor: zoom-in;
    }

    .bubble.media video {
      cursor: auto;
    }

    /* save button on top of photos and videos */
    .save {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 16px;
      text-decoration: none;
    }

    /* files */
    .file-card {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 190px;
      color: inherit;
      text-decoration: none;
    }

    .bubble .file-card {
      text-decoration: none;
    }

    .file-icon {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.28);
      font-size: 22px;
    }

    .them .file-icon {
      background: rgba(0, 0, 0, 0.07);
    }

    .file-text {
      flex: 1;
      min-width: 0;
      line-height: 1.25;
    }

    .file-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 600;
    }

    .file-size {
      display: block;
      font-size: 12px;
      opacity: 0.7;
    }

    .file-down {
      flex: none;
      font-size: 20px;
      opacity: 0.85;
    }

    /* upload / download progress line */
    .bar {
      display: block;
      height: 3px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 2px;
      background: rgba(120, 120, 128, 0.3);
    }

    .bar i {
      display: block;
      width: 0;
      height: 100%;
      background: currentColor;
      transition: width 0.15s linear;
    }

    .bubble.media .bar {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      margin: 0;
      color: #ffffff;
    }

    /* ----- message box ----- */
    .composer {
      flex: none;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
      background: #ffffff;
      border-top: 1px solid var(--im-line);
    }

    .plus {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-bottom: 1px;
      border-radius: 50%;
      background: var(--im-gray);
      color: #5b5b62;
      font-size: 20px;
    }

    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .input-wrap textarea {
      display: block;
      width: 100%;
      min-height: 36px;
      max-height: 120px;
      padding: 7px 42px 7px 14px;
      resize: none;
      border: 1px solid #d1d1d6;
      border-radius: 19px;
      outline: none;
      background: #ffffff;
      color: #000000;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.3;
    }

    .input-wrap textarea:focus {
      border-color: #b8b8be;
    }

    .send {
      position: absolute;
      right: 4px;
      bottom: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--im-blue);
      color: #ffffff;
      font-size: 17px;
    }

    .send svg {
      stroke-width: 2.6;
    }

    .composer.has-text .send {
      display: flex;
    }

    /* ----- photo / video viewer ----- */
    .viewer {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;

    .viewer.show {
      display: flex;
    }

    .viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .viewer-close,
    .viewer-save {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top, 0px));
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 22px;
      text-decoration: none;
    }

    .viewer-close {
      left: 14px;
    }

    .viewer-save {
      right: 14px;
    }


    /* =========================================================
       9. LAPTOP TWEAKS
       ========================================================= */
    @media (min-width: 900px) {

      #local {
        top: 76px;
        right: 20px;
        width: 170px;
        max-width: 170px;
      }

      .dock {
        gap: 10px;
        padding: 10px;
      }

      .dock-btn {
        width: 48px;
        height: 48px;

      }

      /* chat becomes a side panel on a big screen */
      .chat {
        inset: 16px 16px 16px auto;
        width: 390px;
        overflow: hidden;
        border-radius: 26px;
        box-shadow: 0 30px 80px -20px rgba(20, 40, 100, 0.5);
      }
